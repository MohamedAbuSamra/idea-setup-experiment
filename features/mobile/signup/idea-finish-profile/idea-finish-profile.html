<div class="pa">
  <div class="pa-top">
    <button type="button" class="pa-back" data-goto="idea-home" aria-label="Back">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 3.4 5.6 8l4.6 4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="pa-top-title">Finish your profile</span>
  </div>
  <div class="pa-body">
    <p class="pa-sub">Only what we need to send your first order.</p>
    <div class="pa-field"><label>Business name</label><div class="pa-input is-filled">Maya's Corner Shop</div></div>
    <div class="pa-field"><label>Delivery address</label><div class="pa-input">Street, city</div></div>
    <div class="pa-upload">
      <span class="pa-upload-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V3.5M4.8 6.5 8 3.3l3.2 3.2M3 12.7h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <div><strong>One document</strong><span>Business license or ID</span></div>
    </div>
  </div>
  <div class="pa-foot">
    <button type="button" class="pa-btn" data-goto="idea-home">Save and keep shopping</button>
  </div>
</div>
