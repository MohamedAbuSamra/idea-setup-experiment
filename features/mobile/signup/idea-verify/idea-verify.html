<div class="pa">
  <div class="pa-top">
    <button type="button" class="pa-back" data-goto="idea-quick-account" aria-label="Back">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 3.4 5.6 8l4.6 4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="pa-top-title">Verify phone</span>
    <span class="pa-step">2 of 2</span>
  </div>
  <div class="pa-body">
    <div class="pa-progress"><i class="is-done"></i><i class="is-done"></i></div>
    <p class="pa-title">Enter the code</p>
    <p class="pa-sub">We sent a 4-digit code to +1 555 0134.</p>
    <div class="pa-otp only-success"><span class="is-filled">4</span><span class="is-filled">8</span><span class="is-filled">2</span><span class="is-filled">7</span></div>
    <div class="pa-otp is-error only-error"><span>4</span><span>8</span><span>2</span><span>1</span></div>
    <p class="pa-alert only-error">That code didn't match. Check the message and try again.</p>
    <button type="button" class="pa-link">Resend code</button>
  </div>
  <div class="pa-foot">
    <button type="button" class="pa-btn only-success" data-goto="idea-home">Verify</button>
    <button type="button" class="pa-btn only-error">Try again</button>
  </div>
</div>
