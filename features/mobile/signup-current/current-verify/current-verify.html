<div class="pa">
  <div class="pa-top">
    <button type="button" class="pa-back" data-goto="current-documents" aria-label="Back">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.2 3.4 5.6 8l4.6 4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="pa-top-title">Verify phone</span>
    <span class="pa-step">3 of 3</span>
  </div>
  <div class="pa-body">
    <div class="pa-progress"><i class="is-done"></i><i class="is-done"></i><i class="is-done"></i></div>
    <p class="pa-title">Enter the code</p>
    <p class="pa-sub">We sent a 4-digit code to +1 555 0134.</p>
    <div class="pa-otp"><span class="is-filled">4</span><span class="is-filled">8</span><span class="is-filled">2</span><span class="is-filled">7</span></div>
    <button type="button" class="pa-link">Resend code</button>
  </div>
  <div class="pa-foot">
    <button type="button" class="pa-btn" data-goto="current-pending">Verify</button>
  </div>
</div>
