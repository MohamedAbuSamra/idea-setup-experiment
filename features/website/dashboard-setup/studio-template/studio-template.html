<div class="st" data-feature-canvas="studio-template">
  <header class="st-topbar">
    <span class="st-brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c1.6 2.4 1.6 5.2 0 7.6-1.6-2.4-1.6-5.2 0-7.6Zm0 11.4c1.6 2.4 1.6 5.2 0 7.6-1.6-2.4-1.6-5.2 0-7.6ZM2.5 12c2.4-1.6 5.2-1.6 7.6 0-2.4 1.6-5.2 1.6-7.6 0Zm11.4 0c2.4-1.6 5.2-1.6 7.6 0-2.4 1.6-5.2 1.6-7.6 0Z" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/></svg>
      Petal Studio
    </span>
    <span class="st-topbar-spacer"></span>
    <div class="st-steps">
      <span class="is-done"><i>✓</i>Welcome</span><b></b>
      <span class="is-current"><i>2</i>Template</span><b></b>
      <span><i>3</i>Dashboard</span>
    </div>
    <span class="st-topbar-spacer"></span>
    <span class="st-avatar"></span>
  </header>
  <div class="tp-body">
    <h1 class="st-title">Pick a starting template</h1>
    <p class="st-sub">Choose the one closest to how you work. You can switch later.</p>
    <div class="tp-grid">
      <button type="button" class="tp-card" data-template="Shop sales">
        <span class="tp-art is-rose"></span>
        <strong>Shop sales</strong>
        <span>Revenue, top products, repeat customers</span>
      </button>
      <button type="button" class="tp-card" data-template="Bookings">
        <span class="tp-art is-lilac"></span>
        <strong>Bookings</strong>
        <span>Appointments, no-shows, busiest hours</span>
      </button>
      <button type="button" class="tp-card" data-template="Blank">
        <span class="tp-art is-blank"></span>
        <strong>Blank</strong>
        <span>Start empty and add your own cards</span>
      </button>
    </div>
    <div class="tp-actions">
      <button type="button" class="st-link" data-goto="studio-welcome">Back</button>
      <button type="button" class="st-btn" id="studioTemplateContinue" data-goto="studio-dashboard" disabled>Continue</button>
    </div>
  </div>
</div>
